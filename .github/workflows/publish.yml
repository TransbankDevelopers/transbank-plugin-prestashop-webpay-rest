name: Prestashop upload binaries to release

on:
  release:
    types: [created]

jobs:
  run:
    runs-on: ubuntu-latest
    permissions: write-all
    name: Build the plugin with PHP 8.2 and upload binaries
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 2. Setup php and composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
      
      - name: 3. Install dependencies
        run: |
          cd webpay
          composer install --no-dev --no-interaction --prefer-dist

      - name: 4. Verify vendor directory
        run: |
          if [ ! -d "webpay/vendor" ]; then
            echo "ERROR: vendor directory not created!"
            exit 1
          fi
          if [ ! -f "webpay/vendor/autoload.php" ]; then
            echo "ERROR: autoload.php not found!"
            exit 1
          fi
          echo "Dependencies installed successfully"

      - name: 5. Replace versión
        run: |
          GITHUB_TAG="${{github.ref_name}}"
          VERSION="${GITHUB_TAG#v}"
          sed -i.bkp "s/\$this->version = '1.0.0'/\$this->version = '$VERSION'/g" "webpay/webpay.php"
          sed -i.bkp "s/\[1.0.0\]/\[$VERSION\]/g" "webpay/config.xml"
          sed -i.bkp "s/\[1.0.0\]/\[$VERSION\]/g" "webpay/config_es.xml"
          rm -f webpay/*.bkp
          rm -f webpay/*.bak

      - name: 6. Archive Release
        uses: thedoctor0/zip-release@b57d897cb5d60cb78b51a507f63fa184cfe35554
        with:
          type: "zip"
          filename: "plugin-prestashop8.2-webpay-rest-${{github.ref_name}}.zip"
          path: "./webpay"
          exclusions: '*.bkp *.bak'

      - name: 7. Verify ZIP contents
        run: |
          unzip -l "plugin-prestashop8.2-webpay-rest-${{github.ref_name}}.zip" | grep -q "vendor/" || (echo "vendor not in ZIP!" && exit 1)
          echo "ZIP contains vendor directory"

      - name: 8. Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "./plugin-prestashop8.2-webpay-rest-${{github.ref_name}}.zip"
          tag: ${{ github.ref }}
          overwrite: true
