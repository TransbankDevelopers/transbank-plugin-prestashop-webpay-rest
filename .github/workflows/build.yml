name: Prestashop build package

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_url: ${{ steps.artifact_upload.outputs.artifact-url }}
    name: Build the plugin package
    steps:
      - name: 1. Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0

      - name: 2. Setup php and composer
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: "8.2"

      - name: 3. Package plugin
        id: package
        run: |
          chmod +x package.sh
          ./package.sh

      - name: 4. Upload build artifact
        id: artifact_upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: plugin-prestashop-webpay-rest
          path: ./${{ steps.package.outputs.package_output }}
          if-no-files-found: error
          retention-days: 7

  comment:
    permissions:
      issues: write
    needs: build
    uses: transbankdevelopers/transbank-github-actions-templates/.github/workflows/plugin-pr-artifact.yml@a756d10868c2b150c77a11fb4fd6d724cbc4feb0
    with:
      pr_number: ${{ github.event.pull_request.number }}
      source_repo_full_name: ${{ github.event.pull_request.head.repo.full_name }}
      artifact_url: ${{ needs.build.outputs.artifact_url }}
      artifact_name: transbank-plugin-prestashop-webpay-rest.zip
      comment_prefix: Plugin Zip
